<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Singapore-based rising AI startups with Chinese roots</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #f5f5f5;
            color: #1a1a1a;
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #000;
        }

        .subtitle {
            font-size: 18px;
            color: #666;
        }

        /* ONE COMPANY = ONE CARD = ONE FULL-WIDTH ROW */
        .companies-list {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .company-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        /* Company header with logo and name */
        .company-header {
            display: flex;
            align-items: center;
            gap: 30px;
            margin-bottom: 30px;
            padding-bottom: 30px;
            border-bottom: 2px solid #f0f0f0;
        }

        .company-logo {
            width: 120px;
            height: 120px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .company-title {
            flex: 1;
        }

        .company-name {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #000;
        }

        .company-product {
            font-size: 16px;
            color: #666;
            line-height: 1.5;
        }

        .company-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .badge {
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-funding {
            background: #fff3e0;
            color: #e65100;
        }

        .badge-stage {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .badge-year {
            background: #f5f5f5;
            color: #616161;
        }

        /* Company content sections */
        .company-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .section {
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #888;
            margin-bottom: 12px;
        }

        .section-content {
            font-size: 15px;
            line-height: 1.7;
            color: #333;
        }

        .section-content a {
            color: #0066cc;
            text-decoration: none;
            word-break: break-all;
        }

        .section-content a:hover {
            text-decoration: underline;
        }

        /* Founders */
        .founders-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .founder-item {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .founder-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #f0f0f0;
        }

        .founder-name {
            font-size: 15px;
            color: #0066cc;
            text-decoration: none;
            font-weight: 500;
        }

        .founder-name:hover {
            text-decoration: underline;
        }

        /* Full width sections */
        .section-full {
            grid-column: 1 / -1;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #999;
            font-size: 16px;
        }

        .error {
            text-align: center;
            padding: 40px;
            color: #d32f2f;
            background: #ffebee;
            border-radius: 8px;
            margin: 20px 0;
        }

        @media (max-width: 768px) {
            .company-header {
                flex-direction: column;
                text-align: center;
            }

            .company-content {
                grid-template-columns: 1fr;
            }

            .company-logo {
                width: 100px;
                height: 100px;
            }

            .company-name {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Singapore-based rising AI startups with Chinese roots</h1>
            <p class="subtitle">Experienced Chinese founders running AI companies with US$10M+ funding</p>
        </header>

        <div id="loading" class="loading">Loading companies...</div>
        <div id="companies-list" class="companies-list" style="display: none;"></div>
        <div id="error" class="error" style="display: none;"></div>
    </div>

    <script>
        class DashboardApp {
            constructor() {
                this.companies = [];
                this.founderImages = new Map();
            }

            async init() {
                try {
                    await this.loadData();
                    this.renderCompanies();
                } catch (error) {
                    console.error('Error loading data:', error);
                    this.showError(error.message);
                }
            }

            async loadData() {
                // Load both CSV files
                const [companiesRes, imagesRes] = await Promise.all([
                    fetch('../final_dataset/final_dataset_corrected.csv'),
                    fetch('../final_dataset/profile_images.csv')
                ]);

                if (!companiesRes.ok) {
                    throw new Error(`Failed to load company data: ${companiesRes.status} ${companiesRes.statusText}`);
                }
                if (!imagesRes.ok) {
                    throw new Error(`Failed to load founder images: ${imagesRes.status} ${imagesRes.statusText}`);
                }

                const companiesText = await companiesRes.text();
                const imagesText = await imagesRes.text();

                // Parse founder images first
                this.parseFounderImages(imagesText);

                // Parse companies
                this.parseCompanies(companiesText);

                console.log(`Loaded ${this.companies.length} companies`);
                console.log(`Loaded ${this.founderImages.size} founder images`);
            }

            parseFounderImages(csvText) {
                const lines = csvText.trim().split('\n');

                // Skip header
                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;

                    // Simple split for profile images (no complex fields)
                    const parts = line.split(',');
                    if (parts.length >= 3) {
                        const linkedinUrl = parts[1].trim();
                        const imageUrl = parts[2].trim();
                        if (linkedinUrl && imageUrl) {
                            this.founderImages.set(linkedinUrl, imageUrl);
                        }
                    }
                }
            }

            parseCompanies(csvText) {
                const lines = csvText.split('\n');

                // Get header
                const headers = this.parseCSVLine(lines[0]);

                // Parse each company (handle multiline fields)
                let i = 1;
                while (i < lines.length) {
                    const company = this.parseCompanyRow(lines, i, headers);
                    if (company) {
                        this.companies.push(company);
                        i = company._nextLine;
                    } else {
                        i++;
                    }
                }
            }

            parseCompanyRow(lines, startIndex, headers) {
                let line = '';
                let i = startIndex;
                let inQuotes = false;
                let fieldCount = 0;

                // Collect lines until we have all 10 fields
                while (i < lines.length && fieldCount < headers.length) {
                    const currentLine = lines[i];
                    line += (line ? '\n' : '') + currentLine;

                    // Count quotes to determine if we're inside a quoted field
                    for (const char of currentLine) {
                        if (char === '"') inQuotes = !inQuotes;
                    }

                    // If not in quotes, count the fields we have
                    if (!inQuotes) {
                        const testFields = this.parseCSVLine(line);
                        if (testFields.length === headers.length) {
                            fieldCount = testFields.length;
                            break;
                        }
                    }

                    i++;
                }

                if (fieldCount === 0) return null;

                const values = this.parseCSVLine(line);
                const company = {};

                headers.forEach((header, index) => {
                    company[header] = values[index] || '';
                });

                company._nextLine = i + 1;
                return company;
            }

            parseCSVLine(line) {
                const result = [];
                let current = '';
                let inQuotes = false;

                for (let i = 0; i < line.length; i++) {
                    const char = line[i];

                    if (char === '"') {
                        if (inQuotes && i + 1 < line.length && line[i + 1] === '"') {
                            current += '"';
                            i++;
                        } else {
                            inQuotes = !inQuotes;
                        }
                    } else if (char === ',' && !inQuotes) {
                        result.push(current.trim());
                        current = '';
                    } else {
                        current += char;
                    }
                }

                result.push(current.trim());
                return result;
            }

            parseFounders(foundersText) {
                if (!foundersText) return [];

                const founders = [];
                const regex = /([^(]+)\(([^)]+)\)/g;
                let match;

                while ((match = regex.exec(foundersText)) !== null) {
                    // Remove leading comma and whitespace from name
                    const name = match[1].trim().replace(/^,\s*/, '');
                    founders.push({
                        name: name,
                        linkedinUrl: match[2].trim()
                    });
                }

                return founders;
            }

            renderCompanies() {
                const list = document.getElementById('companies-list');
                const loading = document.getElementById('loading');

                list.innerHTML = '';

                if (this.companies.length === 0) {
                    this.showError('No companies found in the dataset');
                    return;
                }

                this.companies.forEach(company => {
                    const card = this.createCompanyCard(company);
                    list.appendChild(card);
                });

                loading.style.display = 'none';
                list.style.display = 'flex';
            }

            createCompanyCard(company) {
                const card = document.createElement('div');
                card.className = 'company-card';

                const founders = this.parseFounders(company['Founders']);

                card.innerHTML = `
                    <div class="company-header">
                        ${company['Company logo'] ? `
                            <img src="${this.escape(company['Company logo'])}"
                                 alt="${this.escape(company['Name'])}"
                                 class="company-logo"
                                 onerror="this.style.display='none'">
                        ` : ''}
                        <div class="company-title">
                            <div class="company-name">${this.escape(company['Name'])}</div>
                            ${company['Product'] ? `
                                <div class="company-product">${this.escape(company['Product'])}</div>
                            ` : ''}
                        </div>
                    </div>

                    <div class="company-content">
                        <div class="section">
                            <div class="section-title">Founders</div>
                            <div class="founders-list">
                                ${founders.map(founder => `
                                    <div class="founder-item">
                                        ${this.founderImages.has(founder.linkedinUrl) ? `
                                            <img src="${this.escape(this.founderImages.get(founder.linkedinUrl))}"
                                                 alt="${this.escape(founder.name)}"
                                                 class="founder-avatar"
                                                 onerror="this.style.display='none'">
                                        ` : ''}
                                        <a href="${this.escape(founder.linkedinUrl)}"
                                           target="_blank"
                                           class="founder-name">${this.escape(founder.name)}</a>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <div class="section">
                            <div class="section-title">Basic Info</div>
                            <div class="section-content">
                                ${company['Company linkedIn'] ? `<strong>Company LinkedIn:</strong> <a href="${this.escape(company['Company linkedIn'])}" target="_blank" style="color: #0066cc; text-decoration: underline;">View Profile</a><br>` : ''}
                                ${company['Year founded'] ? `<strong>Year founded:</strong> ${this.escape(company['Year founded'])}<br>` : ''}
                                ${company['Latest funding stage'] ? `<strong>Latest funding stage:</strong> ${this.escape(company['Latest funding stage'])}<br>` : ''}
                                ${company['Total funding (in US$ million)'] ? `<strong>Total funding (in US$ million):</strong> ${this.escape(company['Total funding (in US$ million)'])}` : ''}
                            </div>
                        </div>

                        <div class="section section-full">
                            <div class="section-title">Founders Background</div>
                            <div class="section-content">
                                ${this.escape(company['Founders background'] || 'N/A')}
                            </div>
                        </div>

                        <div class="section section-full">
                            <div class="section-title">About ${this.escape(company['Name'])}</div>
                            <div class="section-content">
                                ${this.escape(company['Description'])}
                            </div>
                        </div>

                        ${company['Investors'] ? `
                            <div class="section section-full">
                                <div class="section-title">Investors</div>
                                <div class="section-content">
                                    ${this.escape(company['Investors'])}
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;

                return card;
            }

            showError(message) {
                const loading = document.getElementById('loading');
                const error = document.getElementById('error');

                loading.style.display = 'none';
                error.style.display = 'block';
                error.textContent = `Error: ${message}`;
            }

            escape(text) {
                const div = document.createElement('div');
                div.textContent = text || '';
                return div.innerHTML;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const app = new DashboardApp();
            app.init();
        });
    </script>
</body>
</html>
